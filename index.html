<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NEON APEX - a 3D browser racing game built with Three.js" />
  <title>NEON APEX — Browser Racing</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>" />
</head>
<body>
  <div id="app"></div>
  <div id="hud" class="hidden">
    <div id="hud-left" class="panel">
      <div class="big"><span class="lbl">POS</span> <span id="h-pos">1/6</span></div>
      <div class="big"><span class="lbl">LAP</span> <span id="h-lap">1/3</span></div>
      <div class="row"><span class="lbl">TIME</span> <span id="h-time">0:00.000</span></div>
      <div class="row"><span class="lbl">LAST</span> <span id="h-last">--</span></div>
      <div class="row"><span class="lbl">BEST</span> <span id="h-best">--</span></div>
    </div>
    <canvas id="minimap" width="220" height="220"></canvas>
    <canvas id="speedo" width="260" height="260"></canvas>
    <div id="h-cam" class="panel small">CAM: CHASE</div>
    <div id="h-msg"></div>
    <div id="lights"><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <div id="menu" class="screen">
    <div class="card">
      <h1>NEON<span>APEX</span></h1>
      <p class="tag">Golden-hour circuit racing in your browser.</p>
      <div class="opts">
        <label>Laps <select id="opt-laps"><option>1</option><option>2</option><option selected>3</option><option>5</option></select></label>
        <label>Opponents <select id="opt-ai"><option>0</option><option>3</option><option selected>5</option><option>7</option></select></label>
        <label>Difficulty <select id="opt-diff"><option value="0.88">Easy</option><option value="0.95" selected>Medium</option><option value="1.0">Hard</option></select></label>
        <label>Graphics <select id="opt-quality"><option value="0">Low</option><option value="1">Medium</option><option value="2">High</option></select></label>
      </div>
      <button id="btn-start" class="primary">START RACE</button>
      <div class="best">Best lap: <b id="menu-best">--</b></div>
      <div class="help">W/↑ throttle · S/↓ brake/reverse · A D/← → steer · SPACE handbrake · C camera · M mute · ESC pause · Gamepad supported</div>
    </div>
  </div>

  <div id="pause" class="screen hidden">
    <div class="card">
      <h2>PAUSED</h2>
      <button id="btn-resume" class="primary">RESUME</button>
      <button id="btn-restart">RESTART</button>
      <button id="btn-mute">SOUND: ON</button>
      <button id="btn-quit">QUIT TO MENU</button>
    </div>
  </div>

  <div id="results" class="screen hidden">
    <div class="card wide">
      <h2 id="res-title">RESULTS</h2>
      <table id="res-table"></table>
      <div id="res-note"></div>
      <button id="btn-again" class="primary">RACE AGAIN</button>
      <button id="btn-menu">MAIN MENU</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
